syntax = "proto2";

package perfetto.protos;

// Raw Java heap dump (.hprof binary format) embedded in a trace packet.
// Large dumps are split across multiple packets on the same sequence.
// The trace processor reassembles and parses the hprof binary using the
// same parser as standalone .hprof file loading (ArtHprofParser).
message HprofDump {
  // Process ID of the dumped process.
  optional int32 pid = 1;

  // Chunk of raw .hprof binary data.
  optional bytes hprof_data = 2;
}
